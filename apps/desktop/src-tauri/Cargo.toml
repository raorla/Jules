# Shell Tauri du desktop (M9). La logique testable vit dans ../core (`cargo test` sans Tauri).
[package]
name = "jules-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "jules_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
jules-desktop-core = { path = "../core" }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-notification = "2.6.0"
tauri-plugin-opener = "2.7.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-updater = "2.13.3"
