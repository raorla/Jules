# Logique du desktop sans dépendance à Tauri : testée par `cargo test` sur n'importe quelle machine.
[package]
name = "jules-desktop-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
minisign-verify = "0.3.0"
# Signature Ed25519 des confirmations du mode local ; déjà présent dans le shell (plugin de mise à jour).
ring = "0.17.14"
semver = "1.0.28"
sha2 = "0.11.1"
url = "2.5.8"

[dev-dependencies]
minisign = "0.10.0"
