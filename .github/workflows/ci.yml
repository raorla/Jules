name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Testcontainers lance un vrai PostgreSQL : Docker est disponible sur les runners Ubuntu.
      - run: pnpm test
      # Jules audité par son propre agent Sécurité (M11) : échoue sur un finding critique ou haut
      # ouvert, ou sur un risque accepté dont l'échéance est passée.
      - run: pnpm jules audit self --root . --osv https://api.osv.dev

  # Parcours Playwright de l'interface (ROADMAP M6) : vraie api, vrai PostgreSQL, Chromium.
  # Les captures de référence dépendent des polices du système : la CI vérifie les parcours, les
  # contrastes (axe) et la tenue à 390 px ; la comparaison pixel se fait sur la machine de référence.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jules/web exec playwright install --with-deps chromium
      - run: pnpm --filter @jules/web exec vite build
      - run: pnpm --filter @jules/web exec playwright test -c e2e --ignore-snapshots

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f deploy/Dockerfile --target gateway -t jules-gateway .
      - run: docker build -f deploy/Dockerfile --target worker -t jules-worker .
      - run: docker build -f deploy/Dockerfile --target api -t jules-api .

  osv-scanner:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
